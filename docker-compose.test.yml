# ── Docker Compose — Data seeding environment ──
# Usage:
#   docker compose -f docker-compose.test.yml up --build        # Start with auto-seed
#   docker compose -f docker-compose.test.yml up -d --build     # Detached mode
#   docker compose -f docker-compose.test.yml logs -f           # Follow logs
#   docker compose -f docker-compose.test.yml down               # Stop container
#   docker compose -f docker-compose.test.yml down -v            # Stop + remove DB volume
#   docker compose -f docker-compose.test.yml exec nexus-data sh # Shell access

services:
  nexus-data:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: nexus-data
    ports:
      - "3000:3000"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/db/custom.db
    volumes:
      - nexus-data-db:/app/db              # Persist SQLite data between restarts
      - ./data:/app/data:ro                # Mount UCI Online Retail dataset (read-only)
      - ./db/export:/app/db/export         # Host mount for data export/import
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 120s                 # Extra time for ~380K row seeding
    restart: unless-stopped
    command: ["start"]                    # Options: start, seed, seed-only, reset, dev

volumes:
  nexus-data-db:
    driver: local
