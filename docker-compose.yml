services:
  db:
    image: postgres:16-alpine
    container_name: nexus-db
    restart: always
    environment:
      POSTGRES_USER: nexus_user
      POSTGRES_PASSWORD: nexus_password
      POSTGRES_DB: nexus_analytics
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  nexus:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-app
    depends_on:
      - db
    restart: unless-stopped
    ports:
      - "3000:3000"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://nexus_user:nexus_password@db:5432/nexus_analytics?schema=public
    volumes:
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

volumes:
  pgdata:

